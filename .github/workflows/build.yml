# Builds Pocket-Game-Maker for Windows, macOS and Linux on GitHub.
#
#   Push to main or open a pull request: tests run and each system is built, to check it still builds.
#   Nothing is kept.
#   Click "Run workflow" (Actions tab > Build): the same, and the installers are attached to a draft Release
#   called "Test build N" (Releases page, visible only to people who can push to the repository). Only the
#   newest 3 test builds are kept; older ones are deleted automatically.
#   Push a version tag (for example: git tag v0.9.7 && git push origin v0.9.7): the installers are attached
#   to a draft Release named after the tag. Check it, then click Publish.
#
# Storage: installers never go into Actions "artifacts", because those count towards the account's Actions
# storage quota ("Artifact storage quota has been hit"). Release files don't count. Each run also deletes the
# repository's old artifacts from earlier runs, so the quota frees up again (GitHub recounts every 6-12 hours).
# Only small build logs are kept as artifacts, for 3 days, when a build fails - and a full quota never fails
# the build.
#
# Every action used here runs on Node.js 24 (GitHub removed Node 20 from its runners in September 2026),
# and the app itself is built with Node.js 24 and Electron 44 (which also uses Node.js 24).
#
# Code signing is optional. Without it the builds work, but Windows SmartScreen and macOS Gatekeeper
# show a warning the first time. To sign, add these repository secrets (Settings > Secrets and variables > Actions):
#   Windows:  WIN_CSC_LINK (base64 of a .pfx certificate) and WIN_CSC_KEY_PASSWORD
#   macOS:    MAC_CSC_LINK (base64 of a Developer ID Application .p12) and MAC_CSC_KEY_PASSWORD,
#             plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarize
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Tests
    # Pinned: ubuntu-latest is moving to Ubuntu 26 (from 19 October 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the project files are all here
        run: node tools/check-project.js
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Engine and exporter tests
        run: npm test

  storage:
    name: Free up Actions storage
    # Deletes artifacts left by earlier runs (older than a day), which count towards the storage quota.
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | \"\(.id) \(.name) \(.size_in_bytes)\"" |
          while read -r id name size; do
            echo "Deleting artifact $name ($((size / 1048576)) MB)"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

  release:
    name: Prepare the draft release
    # Only for "Run workflow" and version tags. Made once here, so the three builds all add to the same draft.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes --title "Pocket-Game-Maker $TAG"
          else
            TAG="test-build-${{ github.run_number }}"
            VERSION=$(node -p "require('./package.json').version")
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Test build ${{ github.run_number }} (v$VERSION, ${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
              --notes "Installers from a manual run of the Build workflow (run ${{ github.run_id }}). Draft: only people who can push to this repository can see it. Only the newest 3 test builds are kept."
            # keep the newest 3 test builds
            gh release list --limit 100 --json tagName,isDraft,createdAt --jq '[.[] | select(.isDraft and (.tagName | startswith("test-build-")))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
              while read -r old; do echo "Deleting old test build $old"; gh release delete "$old" --yes || true; done
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  smoke:
    # Opens the editor and plays the sample game on a virtual screen. It doesn't hold up the builds:
    # if it fails, the installers are still made, and the screenshots show what happened.
    name: Smoke test (editor and game)
    needs: test
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install a virtual screen and Electron's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgbm1 libnss3 libxss1 libasound2t64 libgtk-3-0t64
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Run the smoke test
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" npx electron --no-sandbox --disable-gpu test/smoke-main.js smoke-out
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: smoke-test-screenshots
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Build (${{ matrix.name }})
    needs: [test, release]
    # Runs after "Prepare the draft release", or without it when that job is skipped (pushes and pull requests).
    if: always() && needs.test.result == 'success' && needs.release.result != 'failure'
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            args: --win --x64 -c.win.signAndEditExecutable=true
            files: dist/*.exe
          - name: macOS
            os: macos-15
            args: --mac --x64 --arm64
            files: dist/*.dmg dist/*-mac-*.zip
          - name: Linux
            os: ubuntu-24.04
            args: --linux --x64
            files: dist/*.AppImage dist/*.deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (optional): electron-builder signs when these are set, and skips signing when they're empty.
          CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_LINK || matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate: building unsigned."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # macOS: electron-builder's signing is turned off and build/adhoc-sign.js gives the app a basic (ad-hoc)
            # signature instead, so it still opens on Apple Silicon Macs (with a Gatekeeper warning the first time).
            if [ "${{ runner.os }}" = "macOS" ]; then EXTRA="-c.mac.identity=null -c.mac.hardenedRuntime=false"; export PGM_ADHOC_SIGN=1; fi
          fi
          # Notarize only with a certificate and an Apple ID. (Give each -c option once: a repeated one becomes a list and is rejected.)
          if [ "${{ runner.os }}" = "macOS" ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ]; }; then EXTRA="$EXTRA -c.mac.notarize=false"; fi

          # Runs electron-builder, keeps its output in build.log, and on failure copies the error lines
          # into the run's Annotations (so they show on the run's summary page without opening the log).
          build() {
            set -o pipefail
            if npx electron-builder "$@" --publish never 2>&1 | tee -a build.log; then return 0; fi
            grep -E "⨯|[Ee]rror|failed|cannot|Cannot" build.log | grep -v "^\s*at " | tail -6 | while IFS= read -r line; do
              echo "::error title=electron-builder (${{ matrix.name }})::${line:0:900}"
            done
            return 1
          }

          if [ "${{ runner.os }}" != "macOS" ]; then
            build ${{ matrix.args }} $EXTRA
            exit $?
          fi

          # macOS: the .zip first, then the .dmg disk images. Making a .dmg on GitHub's Mac machines sometimes fails
          # with "hdiutil: Resource busy", so it is tried up to 3 times; if it still fails, the .zip files are kept.
          build ${{ matrix.args }} $EXTRA -c.mac.target=zip || exit 1
          for attempt in 1 2 3; do
            echo "Making the .dmg files (attempt $attempt of 3)"
            if build ${{ matrix.args }} $EXTRA -c.mac.target=dmg; then exit 0; fi
            sleep 30
          done
          echo "::warning title=macOS .dmg not made::The .dmg disk images could not be made (see the errors above). The .zip downloads for Intel and Apple Silicon Macs were still built."
      - name: Keep the build log (only when the build fails)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Drop the Mac .zip files when the .dmg files were made (the same app, so no need to store both)
        if: runner.os == 'macOS'
        shell: bash
        run: if ls dist/*.dmg >/dev/null 2>&1; then rm -f dist/*-mac-*.zip; fi
      - name: Attach the installers to the draft release
        # Only for "Run workflow" and version tags; pushes and pull requests just check that everything builds.
        # Release files don't use the Actions storage quota.
        if: needs.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.files }})
          if [ ${#files[@]} -eq 0 ]; then echo "::error title=No installers::No installer files were found in dist/"; exit 1; fi
          ls -la "${files[@]}"
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber
          echo "::notice title=Installers ready (${{ matrix.name }})::Attached to the draft release ${{ needs.release.outputs.tag }}: Releases page > Draft."
